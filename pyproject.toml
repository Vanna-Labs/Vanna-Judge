[project]
name = "vanna-judge"
version = "0.2.0"
description = "LLM-as-Judge evaluation framework for RAG systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "VannaLabs" }
]
keywords = ["llm", "rag", "evaluation", "judge", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain-openai>=0.1.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "twine>=5.0.0",
]

[project.scripts]
vanna-judge = "vanna_judge.cli:main"

[project.urls]
Homepage = "https://github.com/Vanna-Labs/vanna-judge"
Repository = "https://github.com/Vanna-Labs/vanna-judge"
Issues = "https://github.com/Vanna-Labs/vanna-judge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vanna_judge"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
